name: Publish preferred B-first market hybrid preview (main ops only)
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: market-hybrid-preview-pages
  cancel-in-progress: false
jobs:
  preview:
    if: contains(github.event.head_commit.message, '[publish-market-hybrid]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/ui-v2-market-hybrid/?ui=v1&marketHybrid=1#market
    env:
      VITE_SUPABASE_URL: https://vveljtqmujdzkzmoncjx.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_IGTsGZshQZAE92bE0_xpYg__bOTs3GU
      VITE_ENABLE_MANUAL_TRADING: 'false'
      VITE_ENABLE_MARKET_FX: 'true'
      VITE_ENABLE_TREASURY_STATS: 'true'
    steps:
      - name: Check out unchanged production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Check out stable v1 preview branch
        uses: actions/checkout@v4
        with:
          ref: design/ui-v1-rebuild
          path: preview-v1
      - name: Check out separate home v2 laboratory branch
        uses: actions/checkout@v4
        with:
          ref: design/home-v2-lab-20261118
          path: preview-v2
      - name: Check out separate market v2 laboratory branch
        uses: actions/checkout@v4
        with:
          ref: design/market-v2-lab-20261118
          path: preview-market
      - name: Check out separate preferred market hybrid preview branch
        uses: actions/checkout@v4
        with:
          ref: design/market-v2-hybrid-20261121
          path: preview-hybrid
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build production from main with matching Pages flags
        working-directory: production
        run: npm ci && npm run build
      - name: Build stable UI v1 from separate branch
        working-directory: preview-v1
        run: npm ci && npm run build
      - name: Build UI v2 home lab from isolated branch
        working-directory: preview-v2
        run: npm ci && npm run build
      - name: Build UI v2 market lab from isolated branch
        working-directory: preview-market
        run: npm ci && npm run build
      - name: Build preferred market hybrid from isolated branch
        working-directory: preview-hybrid
        run: npm ci && npm run build
      - name: Package production and all historic preview paths plus hybrid
        run: |
          mkdir -p _site/preview/ui-v1 _site/preview/ui-v2-home _site/preview/ui-v2-market _site/preview/ui-v2-market-hybrid
          cp -a production/dist/. _site/
          cp -a preview-v1/dist/. _site/preview/ui-v1/
          cp -a preview-v2/dist/. _site/preview/ui-v2-home/
          cp -a preview-market/dist/. _site/preview/ui-v2-market/
          cp -a preview-hybrid/dist/. _site/preview/ui-v2-market-hybrid/
          cmp production/dist/index.html _site/index.html
          test -f _site/index.html
          test -f _site/preview/ui-v1/index.html
          test -f _site/preview/ui-v2-home/index.html
          test -f _site/preview/ui-v2-market/index.html
          test -f _site/preview/ui-v2-market-hybrid/index.html
          test -d _site/assets
          test -d _site/preview/ui-v1/assets
          test -d _site/preview/ui-v2-home/assets
          test -d _site/preview/ui-v2-market/assets
          test -d _site/preview/ui-v2-market-hybrid/assets
          ! grep -q 'ui-v1' _site/index.html
          echo "Production rebuilt unchanged; v1, home, market A/B/C and market hybrid have separate subpaths."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy hybrid without touching production or previous preview paths
        id: deployment
        uses: actions/deploy-pages@v4
