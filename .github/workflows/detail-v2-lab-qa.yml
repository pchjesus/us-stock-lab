name: Stock detail v2 design lab and financial evidence regressions (no deploy)
on:
  push:
    branches: [design/stock-detail-v2-lab-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production-feature-flags build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://vveljtqmujdzkzmoncjx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_IGTsGZshQZAE92bE0_xpYg__bOTs3GU
          VITE_ENABLE_MANUAL_TRADING: 'false'
          VITE_ENABLE_MARKET_FX: 'true'
          VITE_ENABLE_TREASURY_STATS: 'true'
      - run: npx playwright install --with-deps chromium
      - name: Configure Chromium
        run: |
          CHROME=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -type f | head -n 1)
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Stock detail A/B/C, market density and v1 design regression
        run: npx playwright test tests/detail-v2-lab.spec.ts tests/market-density.spec.ts tests/market-hybrid.spec.ts tests/market-v2-lab.spec.ts tests/design-v1.spec.ts --workers=2
      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-detail-a-b-c-plus-market-and-v1-captures
          path: |
            work/detail-v2/captures/*.png
            work/market-density/captures/*.png
            work/market-hybrid/captures/*.png
            work/market-v2/captures/*.png
            work/ui-v1/captures/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Original entire UI regression
        run: npm test -- --workers=2
      - name: Auth regression
        run: npm run test:auth -- --workers=2
      - name: Release regression
        run: npx playwright test --config playwright.release.config.ts --workers=1
      - name: UX0 regression
        run: npm run test:ux0 -- --workers=2
